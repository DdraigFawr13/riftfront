# From the AI-Master-Instructions template (core/templates/github/ci.yml).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review starts the first run of a draft
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft PRs skip CI (CI-06); marking the PR ready runs it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node .claude/master/sync.mjs --check
      - run: npm run check
      - run: npm run build
